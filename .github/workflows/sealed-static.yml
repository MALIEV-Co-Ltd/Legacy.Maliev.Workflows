name: Reviewed sealed Workflows static validation
on:
  workflow_dispatch:
    inputs:
      root_permit:
        description: Fresh Root-issued nine-field hosted-qualification cooperative lease; not cryptographic issuer authentication
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: workflows-sealed-static-candidate
  cancel-in-progress: false
jobs:
  static:
    if: github.repository == 'MALIEV-Co-Ltd/Legacy.Maliev.Workflows' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_INSTALL_DIR: D:/codex-temp/2026-10-09/workflows-hosted-sdk-10.0.401
      DOTNET_ROOT: D:/codex-temp/2026-10-09/workflows-hosted-sdk-10.0.401
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Preserve reviewed Git blob bytes during Windows checkout.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initial headroom before managed SDK bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('dotnet.exe','msbuild.exe','testhost.exe','testhost.x86.exe','vstest.console.exe','vbcscompiler.exe','csc.exe','vbc.exe','fsc.exe','fsi.exe')
          if (Test-Path -LiteralPath $env:DOTNET_INSTALL_DIR) { throw 'Fresh task-owned SDK install root required.' }
          $free = [math]::Floor((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024)
          if ($free -lt 5120 -or @(Get-CimInstance Win32_Process | Where-Object Name -In $names).Count -ne 0) { throw 'Initial resource admission refused.' }
      - name: Pure sealed transport controls
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/test-hosted-static.py
      - name: Pinned SDK archive bootstrap then bounded build-first qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_STATIC_PERMIT: ${{ inputs.root_permit }}
          TRUSTED_WORKFLOW_CONTEXT: >-
            {"repository":"${{ github.repository }}","ref":"${{ github.ref }}","eventName":"${{ github.event_name }}","sha":"${{ github.sha }}","job":${{ toJSON(job) }}}
        run: python -B scripts/run-hosted-static.py
      - name: Retain strict raw evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflows-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/receipt.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/strict-*-result.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/journal.jsonl
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/format.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/build.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/focused.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/suite.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/compiled-discovery.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/compiled-inventory.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/test-results/**/*.trx
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/audit.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/sdk-bootstrap-source.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/sdk-bootstrap-source.bin
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/sdk-identity.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/sdk-bootstrap-record.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/sdk-bootstrap.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/restore.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/head.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/workflows-gitleaks-hosted-static-validation-v1-*/scope.log
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/wrapper-receipt.json
            D:/codex-temp/2026-10-03/legacy-code-workflows-20261003/outputs/wrapper-cleanup.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
