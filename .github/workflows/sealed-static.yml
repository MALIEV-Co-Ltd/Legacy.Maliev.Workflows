name: Reviewed sealed Workflows static validation
on:
  workflow_dispatch:
    inputs:
      root_permit:
        description: Fresh Root-issued nine-field hosted-qualification cooperative lease; not cryptographic issuer authentication
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: workflows-sealed-static-candidate
  cancel-in-progress: false
jobs:
  static:
    if: github.repository == 'MALIEV-Co-Ltd/Legacy.Maliev.Workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_INSTALL_DIR: /tmp/maliev-workflows-qualification/private-sdk/sdk
      DOTNET_ROOT: /tmp/maliev-workflows-qualification/private-sdk/sdk
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Preserve reviewed control bytes; candidate checkout has its own normalization override.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initial headroom before managed SDK bootstrap
        shell: bash
        run: |
          python3 -B -c "from pathlib import Path; m=dict(x.split(':',1) for x in Path('/proc/meminfo').read_text().splitlines()); assert int(m['MemAvailable'].split()[0]) >= 5120*1024; assert not Path('/tmp/maliev-workflows-qualification').exists()"
          command -v bash docker dockerd
      - name: Pure sealed transport controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test-hosted-static.py
      - name: Pinned SDK archive bootstrap then bounded build-first qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_STATIC_PERMIT: ${{ inputs.root_permit }}
          TRUSTED_WORKFLOW_CONTEXT: >-
            {"repository":"${{ github.repository }}","ref":"${{ github.ref }}","eventName":"${{ github.event_name }}","sha":"${{ github.sha }}","job":${{ toJSON(job) }}}
        run: |
          export MALIEV_WORKFLOWS_UID="$(id -u)" MALIEV_WORKFLOWS_GID="$(id -g)"
          sudo --preserve-env=GH_TOKEN,ROOT_STATIC_PERMIT,TRUSTED_WORKFLOW_CONTEXT,MALIEV_WORKFLOWS_UID,MALIEV_WORKFLOWS_GID,GIT_CONFIG_COUNT,GIT_CONFIG_KEY_0,GIT_CONFIG_VALUE_0 python3 -B scripts/run-hosted-static.py
      - name: Retain strict raw evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflows-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/receipt.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/strict-*-result.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/journal.jsonl
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/format.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/build.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery-observation-*.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/focused-observation-*.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/focused-stdout.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/focused-stderr.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/suite-observation-*.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/suite-stdout.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/suite-stderr.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery-stdout.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery-stderr.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/discovery-assembly-observation.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/focused.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/suite.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/compiled-discovery.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/compiled-inventory.json
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/test-results/**/*.trx
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/audit.log
            /tmp/maliev-workflows-qualification/outputs/sdk-bootstrap-source.json
            /tmp/maliev-workflows-qualification/outputs/sdk-bootstrap-source.bin
            /tmp/maliev-workflows-qualification/outputs/sdk-identity.json
            /tmp/maliev-workflows-qualification/outputs/sdk-bootstrap-record.json
            /tmp/maliev-workflows-qualification/outputs/sdk-bootstrap.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/restore.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/head.log
            /tmp/maliev-workflows-qualification/outputs/workflows-gitleaks-hosted-static-validation-v1-*/scope.log
            /tmp/maliev-workflows-qualification/outputs/wrapper-receipt.json
            /tmp/maliev-workflows-qualification/outputs/wrapper-cleanup.json
            /tmp/maliev-workflows-qualification/outputs/linux-capability.json
            /tmp/maliev-workflows-qualification/outputs/docker-daemon.log
          if-no-files-found: error
          retention-days: 7
          overwrite: false
