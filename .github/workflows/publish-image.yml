name: publish-image

on:
  workflow_call:
    inputs:
      image:
        description: Full Artifact Registry image name without a tag or digest
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the caller repository
        required: true
        type: string
      context:
        description: Docker build context relative to the caller repository
        required: true
        type: string
      environment:
        description: Protected GitHub environment authorized for publication
        required: true
        type: string
      workload-identity-provider:
        description: Google Workload Identity Federation provider resource name
        required: true
        type: string
      service-account:
        description: Google service account authorized to publish the image
        required: true
        type: string
      maliev-aspire-ref:
        description: Optional immutable Maliev.Aspire commit required by the caller Docker context
        required: false
        default: ""
        type: string
      messaging-contracts-ref:
        description: Optional immutable Maliev.MessagingContracts commit required by the caller Docker context
        required: false
        default: ""
        type: string
      legacy-service-defaults-ref:
        description: Optional immutable Legacy.Maliev.ServiceDefaults commit required by the caller Docker context
        required: false
        default: ""
        type: string
      compatibility-contracts-ref:
        description: Optional immutable Legacy.Maliev.CompatibilityContracts commit required by the caller Docker context
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  actions: read

jobs:
  validation:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &validation-gate
        name: Verify exact protected-main validation
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, sys, urllib.parse, urllib.request

          def require(condition):
              if not condition:
                  raise ValueError("publication_validation_unavailable")

          def main():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              sha = os.environ.get("GITHUB_SHA", "")
              token = os.environ.get("GH_TOKEN", "")
              require(re.fullmatch(r"MALIEV-Co-Ltd/Legacy\.Maliev\.[A-Za-z0-9_.-]+", repository))
              require(re.fullmatch(r"[0-9a-f]{40}", sha) and token)
              prefix = "https://api.github.com/repos/" + repository + "/actions/"

              def fetch(path):
                  request = urllib.request.Request(prefix + path, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  require(isinstance(result, dict))
                  return result

              def pages(path, field):
                  result = []
                  separator = "&" if "?" in path else "?"
                  for page in range(1, 11):
                      payload = fetch(path + separator + "per_page=100&page=" + str(page))
                      rows = payload.get(field)
                      require(isinstance(rows, list) and len(rows) <= 100)
                      require(all(isinstance(row, dict) for row in rows))
                      result.extend(rows)
                      if len(rows) < 100:
                          return result
                  raise ValueError("publication_validation_unavailable")

              workflow = fetch("workflows/ci-main.yml")
              workflow_id = workflow.get("id")
              require(type(workflow_id) is int and workflow_id > 0)
              require(workflow.get("path") == ".github/workflows/ci-main.yml")
              require(workflow.get("state") == "active")
              query = urllib.parse.urlencode({"event": "push", "branch": "main", "head_sha": sha})
              runs = pages("workflows/" + str(workflow_id) + "/runs?" + query, "workflow_runs")
              require(runs)
              for run in runs:
                  require(type(run.get("id")) is int and run["id"] > 0)
                  require(type(run.get("run_number")) is int and run["run_number"] > 0)
                  require(run.get("status") == "completed")
                  # Conservatively refuse an older failed rerun of this same SHA.
                  require(run.get("conclusion") == "success")
              latest = max(runs, key=lambda run: (run["run_number"], run["id"]))
              run_id = latest["id"]

              def validate_run(run):
                  require(run.get("id") == run_id and run.get("workflow_id") == workflow_id)
                  require(run.get("head_sha") == sha and run.get("head_branch") == "main")
                  require(run.get("event") == "push")
                  require(run.get("head_repository", {}).get("full_name") == repository)
                  require(run.get("repository", {}).get("full_name") == repository)
                  require(run.get("path", "").split("@", 1)[0] == ".github/workflows/ci-main.yml")
                  require(run.get("status") == "completed" and run.get("conclusion") == "success")
                  require(type(run.get("run_attempt")) is int and run["run_attempt"] > 0)
                  references = run.get("referenced_workflows", [])
                  expected = repository + "/.github/workflows/_build-and-test.yml@" + sha
                  require(any(reference.get("path") == expected and reference.get("sha") == sha
                              for reference in references))

              current = fetch("runs/" + str(run_id))
              validate_run(current)
              attempt = current["run_attempt"]
              require(attempt == latest.get("run_attempt"))
              jobs = pages("runs/" + str(run_id) + "/attempts/" + str(attempt) + "/jobs", "jobs")
              require(jobs)
              require(len({job.get("id") for job in jobs}) == len(jobs))
              require(sum(job.get("name") == "validate / validate" for job in jobs) == 1)
              for job in jobs:
                  require(type(job.get("id")) is int and job["id"] > 0)
                  require(job.get("run_attempt") == attempt)
                  require(job.get("run_id") == run_id and job.get("head_sha") == sha)
                  require(job.get("status") == "completed" and job.get("conclusion") == "success")
              # A rerun beginning during pagination invalidates the observed proof.
              observed_again = fetch("runs/" + str(run_id))
              validate_run(observed_again)
              require(observed_again["run_attempt"] == attempt)
              final_runs = pages("workflows/" + str(workflow_id) + "/runs?" + query, "workflow_runs")
              require(final_runs and all(run.get("status") == "completed" for run in final_runs))
              final_latest = max(final_runs, key=lambda run: (run["run_number"], run["id"]))
              require(all(run.get("conclusion") == "success" for run in final_runs))
              validate_run(final_latest)
              require(final_latest.get("id") == run_id and final_latest.get("run_attempt") == attempt)
              print("publication_validation_verified")

          try:
              main()
          except Exception:
              # Never emit API payloads, URLs containing credentials or exception details.
              print("publication_validation_unavailable", file=sys.stderr)
              sys.exit(1)

  publish:
    needs: validation
    if: >-
      needs.validation.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - *validation-gate

      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify caller checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate optional dependency commits
        shell: bash
        env:
          MALIEV_ASPIRE_REF: ${{ inputs.maliev-aspire-ref }}
          MESSAGING_CONTRACTS_REF: ${{ inputs.messaging-contracts-ref }}
          LEGACY_SERVICE_DEFAULTS_REF: ${{ inputs.legacy-service-defaults-ref }}
          COMPATIBILITY_CONTRACTS_REF: ${{ inputs.compatibility-contracts-ref }}
        run: |
          set -euo pipefail
          if [[ -n "$MALIEV_ASPIRE_REF" && ! "$MALIEV_ASPIRE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "maliev-aspire-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$MESSAGING_CONTRACTS_REF" && ! "$MESSAGING_CONTRACTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "messaging-contracts-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$LEGACY_SERVICE_DEFAULTS_REF" && ! "$LEGACY_SERVICE_DEFAULTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "legacy-service-defaults-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$COMPATIBILITY_CONTRACTS_REF" && ! "$COMPATIBILITY_CONTRACTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "compatibility-contracts-ref must be an immutable 40-character commit" >&2
            exit 1
          fi

      - name: Check out pinned Maliev.Aspire dependency
        if: ${{ inputs.maliev-aspire-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: ${{ inputs.maliev-aspire-ref }}
          path: .dependencies/Maliev.Aspire
          persist-credentials: false

      - name: Check out pinned messaging contracts dependency
        if: ${{ inputs.messaging-contracts-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: ${{ inputs.messaging-contracts-ref }}
          path: .dependencies/Maliev.MessagingContracts
          persist-credentials: false

      - name: Check out pinned legacy service defaults dependency
        if: ${{ inputs.legacy-service-defaults-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: ${{ inputs.legacy-service-defaults-ref }}
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false

      - name: Check out pinned legacy compatibility contracts dependency
        if: ${{ inputs.compatibility-contracts-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: ${{ inputs.compatibility-contracts-ref }}
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false

      - name: Prepare immutable image tag
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE" != */* || "$IMAGE" == *:* || "$IMAGE" == *@* ]]; then
            echo "image must be a full registry image name without a tag or digest" >&2
            exit 1
          fi
          IMAGE_REGISTRY="${IMAGE%%/*}"
          echo "IMAGE_REGISTRY=$IMAGE_REGISTRY" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - *validation-gate

      - name: Authenticate to Google Cloud with workload identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          create_credentials_file: false
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Sign in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image once for scanning and publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.image }}:${{ github.sha }}

      - name: Scan the built image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMMIT_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - *validation-gate

      - name: Publish and resolve immutable digest
        id: publish
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          docker push "$COMMIT_TAG"
          DIGEST="$(docker buildx imagetools inspect "$COMMIT_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid image digest" >&2
            exit 1
          fi
          IMAGE_REFERENCE="${IMAGE}@${DIGEST}"
          echo "Published ${IMAGE_REFERENCE}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
