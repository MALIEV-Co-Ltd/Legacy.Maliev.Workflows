name: publish-image

on:
  workflow_call:
    inputs:
      image:
        description: Full Artifact Registry image name without a tag or digest
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the caller repository
        required: true
        type: string
      context:
        description: Docker build context relative to the caller repository
        required: true
        type: string
      environment:
        description: Protected GitHub environment authorized for publication
        required: true
        type: string
      workload-identity-provider:
        description: Google Workload Identity Federation provider resource name
        required: true
        type: string
      service-account:
        description: Google service account authorized to publish the image
        required: true
        type: string
      maliev-aspire-ref:
        description: Optional immutable Maliev.Aspire commit required by the caller Docker context
        required: false
        default: ""
        type: string
      messaging-contracts-ref:
        description: Optional immutable Maliev.MessagingContracts commit required by the caller Docker context
        required: false
        default: ""
        type: string
      legacy-service-defaults-ref:
        description: Optional immutable Legacy.Maliev.ServiceDefaults commit required by the caller Docker context
        required: false
        default: ""
        type: string
      compatibility-contracts-ref:
        description: Optional immutable Legacy.Maliev.CompatibilityContracts commit required by the caller Docker context
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  actions: read

jobs:
  validation:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &validation-gate
        name: Verify exact protected-main validation
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, sys, urllib.parse, urllib.request

          def require(condition):
              if not condition:
                  raise ValueError("publication_validation_unavailable")

          def main():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              sha = os.environ.get("GITHUB_SHA", "")
              token = os.environ.get("GH_TOKEN", "")
              require(re.fullmatch(r"MALIEV-Co-Ltd/Legacy\.Maliev\.[A-Za-z0-9_.-]+", repository))
              require(re.fullmatch(r"[0-9a-f]{40}", sha) and token)
              prefix = "https://api.github.com/repos/" + repository + "/actions/"

              def fetch(path):
                  request = urllib.request.Request(prefix + path, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  require(isinstance(result, dict))
                  return result

              def pages(path, field):
                  result = []
                  separator = "&" if "?" in path else "?"
                  for page in range(1, 11):
                      payload = fetch(path + separator + "per_page=100&page=" + str(page))
                      rows = payload.get(field)
                      require(isinstance(rows, list) and len(rows) <= 100)
                      require(all(isinstance(row, dict) for row in rows))
                      result.extend(rows)
                      if len(rows) < 100:
                          return result
                  raise ValueError("publication_validation_unavailable")

              workflow = fetch("workflows/ci-main.yml")
              workflow_id = workflow.get("id")
              require(type(workflow_id) is int and workflow_id > 0)
              require(workflow.get("path") == ".github/workflows/ci-main.yml")
              require(workflow.get("state") == "active")
              query = urllib.parse.urlencode({"event": "push", "branch": "main", "head_sha": sha})
              runs = pages("workflows/" + str(workflow_id) + "/runs?" + query, "workflow_runs")
              require(runs)
              for run in runs:
                  require(type(run.get("id")) is int and run["id"] > 0)
                  require(type(run.get("run_number")) is int and run["run_number"] > 0)
                  require(run.get("status") == "completed")
                  # Conservatively refuse an older failed rerun of this same SHA.
                  require(run.get("conclusion") == "success")
              latest = max(runs, key=lambda run: (run["run_number"], run["id"]))
              run_id = latest["id"]

              def validate_run(run):
                  require(run.get("id") == run_id and run.get("workflow_id") == workflow_id)
                  require(run.get("head_sha") == sha and run.get("head_branch") == "main")
                  require(run.get("event") == "push")
                  require(run.get("head_repository", {}).get("full_name") == repository)
                  require(run.get("repository", {}).get("full_name") == repository)
                  require(run.get("path", "").split("@", 1)[0] == ".github/workflows/ci-main.yml")
                  require(run.get("status") == "completed" and run.get("conclusion") == "success")
                  require(type(run.get("run_attempt")) is int and run["run_attempt"] > 0)
                  references = run.get("referenced_workflows", [])
                  expected = repository + "/.github/workflows/_build-and-test.yml@" + sha
                  require(any(reference.get("path") == expected and reference.get("sha") == sha
                              for reference in references))

              current = fetch("runs/" + str(run_id))
              validate_run(current)
              attempt = current["run_attempt"]
              require(attempt == latest.get("run_attempt"))
              jobs = pages("runs/" + str(run_id) + "/attempts/" + str(attempt) + "/jobs", "jobs")
              require(jobs)
              require(len({job.get("id") for job in jobs}) == len(jobs))
              require(sum(job.get("name") == "validate / validate" for job in jobs) == 1)
              for job in jobs:
                  require(type(job.get("id")) is int and job["id"] > 0)
                  require(job.get("run_attempt") == attempt)
                  require(job.get("run_id") == run_id and job.get("head_sha") == sha)
                  require(job.get("status") == "completed" and job.get("conclusion") == "success")
              # A rerun beginning during pagination invalidates the observed proof.
              observed_again = fetch("runs/" + str(run_id))
              validate_run(observed_again)
              require(observed_again["run_attempt"] == attempt)
              final_runs = pages("workflows/" + str(workflow_id) + "/runs?" + query, "workflow_runs")
              require(final_runs and all(run.get("status") == "completed" for run in final_runs))
              final_latest = max(final_runs, key=lambda run: (run["run_number"], run["id"]))
              require(all(run.get("conclusion") == "success" for run in final_runs))
              validate_run(final_latest)
              require(final_latest.get("id") == run_id and final_latest.get("run_attempt") == attempt)
              print("publication_validation_verified")

          try:
              main()
          except Exception:
              # Never emit API payloads, URLs containing credentials or exception details.
              print("publication_validation_unavailable", file=sys.stderr)
              sys.exit(1)

  publish:
    needs: validation
    if: >-
      needs.validation.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - *validation-gate

      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify caller checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate optional dependency commits
        shell: bash
        env:
          MALIEV_ASPIRE_REF: ${{ inputs.maliev-aspire-ref }}
          MESSAGING_CONTRACTS_REF: ${{ inputs.messaging-contracts-ref }}
          LEGACY_SERVICE_DEFAULTS_REF: ${{ inputs.legacy-service-defaults-ref }}
          COMPATIBILITY_CONTRACTS_REF: ${{ inputs.compatibility-contracts-ref }}
        run: |
          set -euo pipefail
          if [[ -n "$MALIEV_ASPIRE_REF" && ! "$MALIEV_ASPIRE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "maliev-aspire-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$MESSAGING_CONTRACTS_REF" && ! "$MESSAGING_CONTRACTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "messaging-contracts-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$LEGACY_SERVICE_DEFAULTS_REF" && ! "$LEGACY_SERVICE_DEFAULTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "legacy-service-defaults-ref must be an immutable 40-character commit" >&2
            exit 1
          fi
          if [[ -n "$COMPATIBILITY_CONTRACTS_REF" && ! "$COMPATIBILITY_CONTRACTS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "compatibility-contracts-ref must be an immutable 40-character commit" >&2
            exit 1
          fi

      - name: Check out pinned Maliev.Aspire dependency
        if: ${{ inputs.maliev-aspire-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: ${{ inputs.maliev-aspire-ref }}
          path: .dependencies/Maliev.Aspire
          persist-credentials: false

      - name: Check out pinned messaging contracts dependency
        if: ${{ inputs.messaging-contracts-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: ${{ inputs.messaging-contracts-ref }}
          path: .dependencies/Maliev.MessagingContracts
          persist-credentials: false

      - name: Check out pinned legacy service defaults dependency
        if: ${{ inputs.legacy-service-defaults-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: ${{ inputs.legacy-service-defaults-ref }}
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false

      - name: Check out pinned legacy compatibility contracts dependency
        if: ${{ inputs.compatibility-contracts-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: ${{ inputs.compatibility-contracts-ref }}
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false

      - name: Prepare immutable image tag
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE" != */* || "$IMAGE" == *:* || "$IMAGE" == *@* ]]; then
            echo "image must be a full registry image name without a tag or digest" >&2
            exit 1
          fi
          IMAGE_REGISTRY="${IMAGE%%/*}"
          echo "IMAGE_REGISTRY=$IMAGE_REGISTRY" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - *validation-gate

      - name: Authenticate to Google Cloud with workload identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          create_credentials_file: false
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Sign in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image once for scanning and publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify packaged Intranet assets and source revision
        id: intranet-artifacts
        shell: python
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_DOCKERFILE: ${{ inputs.dockerfile }}
          BUILT_IMAGE: ${{ env.COMMIT_TAG }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          """Current two-image Intranet publish output contract; no build or container worker."""
          import hashlib
          import json
          from pathlib import Path

          ROLE_ARTIFACTS = {
              'compatibility': ('Legacy.Maliev.Intranet', (
                  'wwwroot/css/ibm-plex-sans-thai.css', 'wwwroot/css/site.css',
                  'wwwroot/js/compat-shell.js',
                  'wwwroot/fonts/ibm-plex-sans-thai/IBMPlexSansThai-Regular.woff2',
                  'wwwroot/fonts/ibm-plex-sans-thai/IBMPlexSansThai-SemiBold.woff2',
                  'wwwroot/fonts/ibm-plex-sans-thai/LICENSE.txt',
              )),
              'bff': ('Legacy.Maliev.Intranet.Bff', ()),
          }


          class ArtifactRejected(ValueError):
              def __init__(self):
                  super().__init__('Current Intranet artifact contract rejected.')


          def verify_publish_tree(role, publish_root):
              """Inspect a supplied publish tree, without pretending it is a built image.

              The caller must bind that tree to the OCI image digest/revision separately.
              The standalone WASM Client is absent from the current two-image build graph;
              no guessed boot-manifest or fingerprinted .wasm filename is admitted here.
              """
              if role not in ROLE_ARTIFACTS:
                  raise ArtifactRejected()
              root = Path(publish_root).resolve(strict=True)
              assembly, assets = ROLE_ARTIFACTS[role]
              required = (assembly + '.dll', assembly + '.deps.json', assembly + '.runtimeconfig.json') + assets
              evidence = []
              for relative in required:
                  path = root / relative
                  if path.is_symlink() or not path.is_file():
                      raise ArtifactRejected()
                  resolved = path.resolve(strict=True)
                  if not resolved.is_relative_to(root) or not 0 < path.stat().st_size <= 128 * 1024 * 1024:
                      raise ArtifactRejected()
                  fingerprint=hashlib.sha256()
                  with path.open('rb') as stream:
                      for chunk in iter(lambda:stream.read(1024*1024),b''):
                          fingerprint.update(chunk)
                  evidence.append(dict(path=relative, bytes=path.stat().st_size, sha256=fingerprint.hexdigest()))
              invalid = False
              try:
                  if any((root/(assembly+suffix)).stat().st_size>4*1024*1024 for suffix in ('.deps.json','.runtimeconfig.json')):
                      raise ValueError()
                  deps = json.loads((root / (assembly + '.deps.json')).read_text(encoding='utf-8'))
                  runtime = json.loads((root / (assembly + '.runtimeconfig.json')).read_text(encoding='utf-8'))
                  libraries = deps['libraries']
                  if type(libraries) is not dict or not any(name.split('/')[0] == assembly for name in libraries):
                      invalid = True
                  if type(runtime.get('runtimeOptions')) is not dict or runtime['runtimeOptions'].get('tfm')!='net10.0':
                      invalid = True
              except Exception:
                  invalid = True
              if invalid:
                  raise ArtifactRejected()
              return dict(role=role, assembly=assembly, files=evidence, sourceContractVerified=True,
                          builtImageAccepted=False, sourceCompletion=False, runtimeAccepted=False)

          """Source-only adapter for the existing publisher's Docker stdout interface.

          Embedded after the exact artifact contract in the reusable workflow. Tests
          provide a Docker state model; importing this file never invokes Docker.
          """
          import datetime
          import json
          import re
          import tarfile
          import tempfile
          import uuid
          import shutil
          from contextlib import contextmanager
          from pathlib import Path
          try:
              import resource
          except ImportError:
              resource=None

          ARCHIVE_LIMIT=512*1024**2


          class ImageRecoveryRequired(ValueError):
              def __init__(self,receipt):
                  super().__init__('Intranet image cleanup ownership or absence unverified.')
                  self.recovery_receipt=receipt


          @contextmanager
          def export_disk_guard(directory):
              # docker export --output writes from the CLI, which inherits this limit.
              # The check is admission evidence; it is not a filesystem reservation.
              if resource is None or shutil.disk_usage(directory).free < 2*ARCHIVE_LIMIT+64*1024**2:
                  raise ValueError('Intranet archive disk admission unavailable.')
              previous=resource.getrlimit(resource.RLIMIT_FSIZE)
              if previous[1]!=resource.RLIM_INFINITY and previous[1]<ARCHIVE_LIMIT:
                  raise ValueError('Intranet archive write limit unavailable.')
              applied=(min(previous[0],ARCHIVE_LIMIT) if previous[0]!=resource.RLIM_INFINITY else ARCHIVE_LIMIT,previous[1])
              resource.setrlimit(resource.RLIMIT_FSIZE,applied)
              try:
                  if resource.getrlimit(resource.RLIMIT_FSIZE)!=applied:
                      raise ValueError('Intranet archive write-limit readback rejected.')
                  yield
              finally:
                  resource.setrlimit(resource.RLIMIT_FSIZE,previous)


          def inspect_intranet_image(repository, dockerfile, image, revision, native):
              if repository != 'MALIEV-Co-Ltd/Legacy.Maliev.Intranet':
                  return {'status':'not-applicable'}
              roles={'Legacy.Maliev.Intranet/Dockerfile':'compatibility',
                     'Legacy.Maliev.Intranet.Bff/Dockerfile':'bff'}
              if dockerfile not in roles or not re.fullmatch('[0-9a-f]{40}',revision):
                  raise ValueError('Intranet image contract rejected.')
              role=roles[dockerfile]
              suffix='/legacy-maliev-intranet-'+role+':'+revision
              if not image.endswith(suffix) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/:-]{1,511}',image):
                  raise ValueError('Intranet image contract rejected.')
              image_id=native(['image','inspect','--format','{{.Id}}',image])
              if not re.fullmatch('sha256:[0-9a-f]{64}',image_id):
                  raise ValueError('Intranet image contract rejected.')
              def image_fence():
                  if native(['image','inspect','--format','{{.Id}}',image]) != image_id:
                      raise ValueError('Intranet image contract rejected.')
                  label=native(['image','inspect','--format','{{index .Config.Labels "org.opencontainers.image.revision"}}',image_id])
                  if label != revision:
                      raise ValueError('Intranet image contract rejected.')
                  volumes=json.loads(native(['image','inspect','--format','{{json .Config.Volumes}}',image_id]))
                  if volumes is not None and volumes!={}:
                      raise ValueError('Intranet image volume ownership unavailable.')
              image_fence()
              nonce=uuid.uuid4().hex
              name='legacy-intranet-artifact-'+nonce
              label_key='maliev.codex.artifact-owner'
              create_start=datetime.datetime.now(datetime.timezone.utc)
              expiry=(create_start+datetime.timedelta(minutes=10)).isoformat()
              container=None
              created_identity=None
              create_attempted=False
              def owned_record(reference):
                  records=json.loads(native(['container','inspect',reference]))
                  if type(records) is not list or len(records)!=1:
                      raise ValueError('Intranet image ownership rejected.')
                  item=records[0]
                  created=item.get('Created','')
                  # Docker RFC3339 Created can have nanoseconds; ISO parsing truncates
                  # precision to microseconds without broad time-equality guesses.
                  timestamp=datetime.datetime.fromisoformat(created.replace('Z','+00:00'))
                  now=datetime.datetime.now(datetime.timezone.utc)
                  labels=item.get('Config',{}).get('Labels',{})
                  if (not re.fullmatch('[0-9a-f]{64}',item.get('Id','')) or item.get('Name')!='/'+name
                      or item.get('Image')!=image_id or labels.get(label_key)!=nonce
                      or labels.get('maliev.codex.artifact-expiry')!=expiry
                      or timestamp.tzinfo is None or not create_start<=timestamp<=now
                      or item.get('Mounts')!=[] or item.get('State',{}).get('Running') is not False
                      or item.get('State',{}).get('Status')!='created'
                      or item.get('State',{}).get('StartedAt')!='0001-01-01T00:00:00Z'):
                      raise ValueError('Intranet image ownership rejected.')
                  return item
              def container_fence():
                  item=owned_record(container)
                  if item['Id']!=container or item['Created']!=created_identity:
                      raise ValueError('Intranet image ownership rejected.')
              try:
                  create_attempted=True
                  returned=native(['create','--name',name,'--network','none','--read-only','--cap-drop','ALL',
                                   '--security-opt','no-new-privileges','--memory','64m','--cpus','0.25',
                                   '--label',label_key+'='+nonce,'--label','maliev.codex.artifact-expiry='+expiry,
                                   '--entrypoint','/maliev-never-started',image_id])
                  if not re.fullmatch('[0-9a-f]{64}',returned):
                      raise ValueError('Intranet image creation receipt rejected.')
                  container=returned
                  created_identity=owned_record(container)['Created']
                  container_fence()
                  assembly,assets=ROLE_ARTIFACTS[role]
                  required={assembly+'.dll',assembly+'.deps.json',assembly+'.runtimeconfig.json',*assets}
                  with tempfile.TemporaryDirectory(prefix='legacy-intranet-artifact-') as temporary:
                      root=Path(temporary);archive=root/'filesystem.tar';publish=root/'publish';publish.mkdir()
                      with export_disk_guard(root):
                          native(['container','export','--output',str(archive),container])
                      if not archive.is_file() or archive.stat().st_size>512*1024**2:
                          raise ValueError('Intranet image archive rejected.')
                      seen=set();found=set();selected_bytes=0
                      with tarfile.open(archive,mode='r|') as filesystem:
                          for index,member in enumerate(filesystem):
                              if index>=100000:
                                  raise ValueError('Intranet image archive rejected.')
                              path=member.name.removeprefix('./')
                              if not path.startswith('app/'):
                                  continue
                              if path in seen:
                                  raise ValueError('Intranet image archive rejected.')
                              seen.add(path)
                              relative=path[4:]
                              if relative not in required:
                                  continue
                              bound=4*1024**2 if relative.endswith('.json') else 128*1024**2
                              if not member.isfile() or not 0<member.size<=bound:
                                  raise ValueError('Intranet image archive rejected.')
                              selected_bytes+=member.size
                              if selected_bytes>ARCHIVE_LIMIT:
                                  raise ValueError('Intranet selected file write bound exceeded.')
                              target=publish/relative;target.parent.mkdir(parents=True,exist_ok=True)
                              with filesystem.extractfile(member) as source,target.open('xb') as output:
                                  remaining=member.size
                                  while remaining:
                                      chunk=source.read(min(1024**2,remaining))
                                      if not chunk:
                                          raise ValueError('Intranet image archive rejected.')
                                      output.write(chunk);remaining-=len(chunk)
                              found.add(relative)
                      if found!=required:
                          raise ValueError('Intranet image artifact corpus rejected.')
                      result=verify_publish_tree(role,publish)
                      image_fence();container_fence()
                      return dict(status='source-image-artifacts-verified',role=role,imageId=image_id,
                                  sourceRevision=revision,files=result['files'],runtimeAccepted=False)
              finally:
                  if create_attempted:
                      try:
                          if container is None or created_identity is None:
                              # A timeout/malformed stdout may follow successful creation.
                              # Recover only by the exact generated name plus independent
                              # owner/image/Created evidence; never delete by name alone.
                              matches=native(['container','ls','--all','--no-trunc','--quiet','--filter','name=^/'+name+'$'])
                              if matches:
                                  item=owned_record(name)
                                  if matches!=item['Id']:
                                      raise ValueError('Intranet recovery identity rejected.')
                                  if container is not None and container!=item['Id']:
                                      raise ValueError('Intranet recovery identity rejected.')
                                  container=item['Id'];created_identity=item['Created']
                              else:
                                  # An interrupted create may still be running on the
                                  # daemon; one empty listing cannot close that lease.
                                  raise ValueError('Intranet creation completion unavailable.')
                          if container is not None:
                              container_fence()
                              native(['container','rm',container])
                              remaining=native(['container','ls','--all','--no-trunc','--quiet','--filter','id='+container])
                              if remaining:
                                  raise ValueError('Intranet image cleanup incomplete.')
                      except Exception:
                          raise ImageRecoveryRequired(dict(ownerNonce=nonce,name=name,containerId=container,
                              imageId=image_id,creationStartedUtc=create_start.isoformat(),createdIdentity=created_identity,
                              expiryUtc=expiry,expiryIsAutomaticCleanup=False,cleanupVerified=False,
                              createMayBeInFlight=container is None,
                              purpose='never-started Intranet image inspection',persistentData=None,
                              expectedPersistentData=False)) from None

          import os, subprocess, sys
          def native(arguments):
              result = subprocess.run(["docker", *arguments], capture_output=True, timeout=120)
              if result.returncode != 0 or len(result.stdout) > 65536:
                  raise ValueError("Image inspection unavailable")
              return result.stdout.decode("ascii").strip()


          if __name__ == '__main__':
              try:
                  receipt=inspect_intranet_image(os.environ.get('CALLER_REPOSITORY',''),os.environ.get('SOURCE_DOCKERFILE',''),
                      os.environ.get('BUILT_IMAGE',''),os.environ.get('SOURCE_REVISION',''),native)
                  if receipt['status'] != 'not-applicable':
                      with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                          output.write('imageId='+receipt['imageId']+'\n')
                  print(json.dumps(receipt,sort_keys=True))
              except Exception as failure:
                  if isinstance(failure,ImageRecoveryRequired):
                      recovery=json.dumps(failure.recovery_receipt,sort_keys=True)
                      print('[intranet-image-recovery] '+recovery,file=sys.stderr)
                      summary=os.environ.get('GITHUB_STEP_SUMMARY')
                      if summary:
                          with open(summary,'a',encoding='utf-8') as output:
                              output.write('Intranet inspection requires ownership recovery. Expiry is not automatic cleanup.\n\n```json\n'+recovery+'\n```\n')
                  print('[intranet-image-artifacts] FAILED: image contract or ownership incomplete; details redacted',file=sys.stderr)
                  sys.exit(2)

      - name: Verify packaged Web assets and source revision
        shell: python
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_DOCKERFILE: ${{ inputs.dockerfile }}
          BUILT_IMAGE: ${{ env.COMMIT_TAG }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import tarfile
          import tempfile
          import uuid

          def native(arguments):
              result = subprocess.run(["docker", *arguments], capture_output=True, timeout=120)
              if result.returncode != 0 or len(result.stdout) > 65536:
                  raise ValueError("Image inspection unavailable")
              return result.stdout.decode("ascii").strip()

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Ambiguous manifest")
                  result[key] = value
              return result

          def inspect():
              if os.environ.get("CALLER_REPOSITORY") != "MALIEV-Co-Ltd/Legacy.Maliev.Web":
                  return {"status": "not-applicable"}
              if os.environ.get("SOURCE_DOCKERFILE") != "Legacy.Maliev.Web/Dockerfile":
                  raise ValueError("Unreviewed Web artifact identity")
              revision = os.environ.get("EXPECTED_SOURCE_REVISION", "")
              if not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise ValueError("Invalid source revision")
              image = os.environ.get("BUILT_IMAGE", "")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/:@-]{1,511}", image):
                  raise ValueError("Invalid local image identity")
              image_id = native(["image", "inspect", "--format", "{{.Id}}", image])
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
                  raise ValueError("Invalid immutable image identity")
              label = native(["image", "inspect", "--format",
                              '{{index .Config.Labels "org.opencontainers.image.revision"}}', image_id])
              if label != revision:
                  raise ValueError("Packaged source revision mismatch")
              manifest = {
                  "scripts": ["vendor.min.js", "app.min.js"],
                  "routeScripts": ["route-inquiry.js", "route-error.js", "route-instant-quotation.js",
                                   "route-member-order.js", "route-service-finder.js", "route-service-cnc.js",
                                   "route-service-finishing.js", "route-service-printing.js",
                                   "route-service-scanning.js", "route-service-toc.js"],
                  "routeScopedModules": {"instantQuotationViewer": "instant-quotation-viewer.mjs",
                                         "instantQuotationWorkflow": "instant-quotation-workflow.mjs"},
                  "styles": ["site.min.css"],
                  "routeStyles": ["route-about.css", "route-home.css", "route-inquiry.css", "route-error.css",
                                  "route-instant-quotation.css", "route-services.css", "route-services-index.css"],
              }
              names = manifest["scripts"] + manifest["routeScripts"] + list(manifest["routeScopedModules"].values())
              names += manifest["styles"] + manifest["routeStyles"]
              required = {"app/wwwroot/dist/" + name for name in names}
              manifest_path = "app/wwwroot/dist/asset-manifest.json"
              texts = required & {"app/wwwroot/dist/" + name for name in manifest["styles"] + manifest["routeStyles"]}
              texts.add(manifest_path)
              container = "legacy-web-assets-check-" + uuid.uuid4().hex
              try:
                  native(["create", "--name", container, "--network", "none", "--read-only", "--cap-drop", "ALL",
                          "--security-opt", "no-new-privileges", "--entrypoint", "/maliev-never-started", image_id])
                  with tempfile.TemporaryDirectory(prefix="legacy-web-assets-") as temporary:
                      archive = os.path.join(temporary, "filesystem.tar")
                      native(["container", "export", "--output", archive, container])
                      if os.path.getsize(archive) > 4 * 1024 ** 3:
                          raise ValueError("Image inspection bound exceeded")
                      files = {}
                      contents = {}
                      with tarfile.open(archive, mode="r|") as filesystem:
                          for index, member in enumerate(filesystem):
                              if index >= 100000:
                                  raise ValueError("Image entry bound exceeded")
                              name = member.name.removeprefix("./")
                              if not name.startswith("app/wwwroot/"):
                                  continue
                              if name in files:
                                  raise ValueError("Ambiguous packaged path")
                              files[name] = member.size if member.isfile() else 0
                              if name in texts:
                                  if not member.isfile() or not 0 < member.size <= 4 * 1024 ** 2:
                                      raise ValueError("Invalid packaged metadata")
                                  contents[name] = filesystem.extractfile(member).read().decode("utf-8")
                      if any(files.get(name, 0) < 1 for name in required) or manifest_path not in contents:
                          raise ValueError("Packaged asset corpus incomplete")
                      if json.loads(contents[manifest_path], object_pairs_hook=unique_object) != manifest:
                          raise ValueError("Packaged manifest contract mismatch")
                      fonts = set()
                      for path in texts - {manifest_path}:
                          for reference in re.findall(r'url\(\s*["\']?([^\s)"\']+)', contents[path]):
                              if not re.search(r"\.(?:woff2?|ttf|otf)(?:[?#]|$)", reference):
                                  continue
                              if re.fullmatch(r"\./assets/[A-Za-z0-9._-]+\.(?:woff2?|ttf|otf)", reference):
                                  font = "app/wwwroot/dist/" + reference.removeprefix("./")
                              elif re.fullmatch(r"/lib/(?:outfit|ibm-plex)/[A-Za-z0-9._-]+\.woff2", reference):
                                  font = "app/wwwroot" + reference
                              else:
                                  raise ValueError("Unreviewed packaged font reference")
                              if files.get(font, 0) < 1:
                                  raise ValueError("Packaged font missing or empty")
                              fonts.add(font)
                      families = ["outfit-latin-" + weight + "-normal-" for weight in ("400", "500", "600")]
                      families += ["noto-sans-thai-thai-" + weight + "-normal-" for weight in ("400", "500", "600")]
                      families += ["fa-brands-400-", "fa-regular-400-", "fa-solid-900-", "fa-v4compatibility-"]
                      if any(not any(os.path.basename(font).startswith(family) and font.endswith(".woff2")
                                     for font in fonts) for family in families):
                          raise ValueError("Packaged font family corpus incomplete")
                  return {"status": "accepted", "assetCount": len(required), "fontCount": len(fonts),
                          "imageId": image_id, "sourceRevision": revision}
              finally:
                  native(["container", "rm", "--force", container])

          try:
              receipt = inspect()
          except Exception:
              print("[web-packaged-assets] FAILED: image inspection incomplete; details redacted", file=sys.stderr)
              sys.exit(2)
          print(json.dumps(receipt, sort_keys=True))

      - name: Scan the built image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.intranet-artifacts.outputs.imageId || env.COMMIT_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - *validation-gate

      - name: Publish and resolve immutable digest
        id: publish
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          CALLER_REPOSITORY: ${{ github.repository }}
          VERIFIED_INTRANET_IMAGE_ID: ${{ steps.intranet-artifacts.outputs.imageId }}
        run: |
          set -euo pipefail
          if [[ "$CALLER_REPOSITORY" == "MALIEV-Co-Ltd/Legacy.Maliev.Intranet" ]]; then
            if [[ ! "$VERIFIED_INTRANET_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Intranet built-image verification unavailable" >&2
              exit 1
            fi
            test "$(docker image inspect --format '{{.Id}}' "$COMMIT_TAG")" = "$VERIFIED_INTRANET_IMAGE_ID"
          fi
          docker push "$COMMIT_TAG"
          DIGEST="$(docker buildx imagetools inspect "$COMMIT_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid image digest" >&2
            exit 1
          fi
          IMAGE_REFERENCE="${IMAGE}@${DIGEST}"
          echo "Published ${IMAGE_REFERENCE}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
