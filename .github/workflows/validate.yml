name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    needs: [service-wrapper-contracts, sealed-transport-controls, journal-focused]
    uses: ./.github/workflows/dotnet-validate.yml
    with:
      solution: Legacy.Maliev.Workflows.slnx

  sealed-transport-controls:
    name: Linux sealed transport controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-sealed-transport-controls
      cancel-in-progress: true
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native JSON stdout and private stderr
        shell: pwsh
        timeout-minutes: 1
        run: ./tests/RedactedNativeOutputScenarios.ps1
      - name: Compile sealed transport controls
        run: |
          python3 -B -W error - <<'PY'
          from pathlib import Path
          for name in ('scripts/run-hosted-static.py', 'scripts/test-hosted-static.py', 'scripts/test-hosted-native-profile.py'):
              compile(Path(name).read_bytes(), name, 'exec')
          PY
      - name: Observe Linux executable trust metadata without starting executables
        run: |
          sudo -n timeout 30s python3 -B - <<'PY'
          import json,os,shutil,stat
          from pathlib import Path
          def identity(value):
              return {'uid':value.st_uid,'gid':value.st_gid,'mode':oct(value.st_mode),
                      'device':value.st_dev,'inode':value.st_ino,'bytes':value.st_size,
                      'modifiedNs':value.st_mtime_ns}
          roots=[Path('/usr/bin'),Path('/usr/sbin'),Path('/usr/local/bin')]
          records=[]
          for name in ('bash','docker','dockerd'):
              requested=Path(shutil.which(name)).absolute()
              resolved=requested.resolve(strict=True)
              chain=[]
              for path in dict.fromkeys([requested,*requested.parents,resolved,*resolved.parents]):
                  value=path.lstat()
                  chain.append({'path':str(path),'lstat':identity(value),'symlink':stat.S_ISLNK(value.st_mode)})
              fd=os.open(resolved,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  held=os.fstat(fd);observed=resolved.stat(follow_symlinks=False)
                  predicates={'canonicalRoots':all(root.resolve(strict=True)==root and root.is_dir() for root in roots),
                              'insideAllowedRoot':any(resolved.is_relative_to(root) for root in roots),
                              'regularFile':stat.S_ISREG(held.st_mode),'rootOwned':held.st_uid==0,
                              'modeAccepted':held.st_mode & 0o7022==0,'within64MiB':held.st_size<=64*1024**2,
                              'heldIdentityMatchesPath':(held.st_dev,held.st_ino)==(observed.st_dev,observed.st_ino)}
                  records.append({'name':name,'requested':str(requested),'resolved':str(resolved),
                                  'parentChain':chain,'fstat':identity(held),'pathStat':identity(observed),
                                  'predicates':predicates})
              finally:os.close(fd)
          raw=json.dumps({'diagnosticOnly':True,'controllerUid':os.getuid(),'executables':records},sort_keys=True)
          assert len(raw.encode())<=32768
          print(raw)
          PY
      - name: Test sealed transport controls on Linux
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -W error scripts/test-hosted-static.py -v
          python3 -B -W error scripts/test-hosted-native-profile.py -v

  service-wrapper-contracts:
    name: offline Service wrapper contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-service-wrapper-contracts
      cancel-in-progress: true
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile offline Service wrapper modules
        run: |
          python3 -B -W error - <<'PY'
          from pathlib import Path
          for name in ('scripts/service_manifest_wrapper.py', 'tests/test_service_manifest_wrapper.py'):
              compile(Path(name).read_bytes(), name, 'exec')
          PY
      - name: Test offline Service wrapper contract
        run: python3 -B -W error -m unittest discover -s tests -p 'test_service_manifest_wrapper.py' -v

  scanner-caller-subdirectory:
    name: scanner caller subdirectory
    uses: ./.github/workflows/dotnet-validate.yml
    with:
      working-directory: tools/analytics/WireFixtures
      solution: WireFixtures.csproj

  analytics-wire:
    name: analytics wire fixtures and verifier
    needs: [validate, scanner-caller-subdirectory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-analytics-wire
      cancel-in-progress: true
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build synthetic wire fixture generator
        run: dotnet build tools/analytics/WireFixtures/WireFixtures.csproj --configuration Release --disable-build-servers -m:1 /p:UseSharedCompilation=false /nr:false

      - name: Verify all nine synthetic fixture snapshots
        run: dotnet run --no-build --no-restore --configuration Release --project tools/analytics/WireFixtures -- --verify tools/analytics/fixtures

      - name: Test analytics receipts and producer proof verifier
        run: python3 -B -W error -m unittest discover -s tools/analytics/tests -p 'test_*.py' -v

  journal-focused:
    name: journal focused actual source controls
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - name: Check out exact journal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_HEAD }}
          persist-credentials: false
      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain)"
      - name: Set up existing ordinary validation SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Admit focused runner resources before Release
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import pathlib,re
          memory=pathlib.Path('/proc/meminfo').read_text()
          value=re.search(r'^MemAvailable:\s+(\d+) kB$',memory,re.M)
          assert value and int(value.group(1))>=3145728
          active=[]
          for path in pathlib.Path('/proc').iterdir():
              if path.name.isdigit():
                  try:
                      if (path/'comm').read_text().strip() in ('dotnet','MSBuild','testhost'):active.append(path.name)
                  except FileNotFoundError:pass
          assert not active
          PY
      - name: Build Release before focused execution
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          dotnet build Legacy.Maliev.Workflows.slnx -c Release --disable-build-servers -warnaserror -p:UseSharedCompilation=false -nodeReuse:false
      - name: Admit focused runner resources before test
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import pathlib,re
          memory=pathlib.Path('/proc/meminfo').read_text()
          value=re.search(r'^MemAvailable:\s+(\d+) kB$',memory,re.M)
          assert value and int(value.group(1))>=3145728
          active=[]
          for path in pathlib.Path('/proc').iterdir():
              if path.name.isdigit():
                  try:
                      if (path/'comm').read_text().strip() in ('dotnet','MSBuild','testhost'):active.append(path.name)
                  except FileNotFoundError:pass
          assert not active
          PY
      - name: Run actual journal focused Fact and twenty Python controls
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -B tests/test_focused_retention.py
          dotnet test tests/Legacy.Maliev.Workflows.Tests/Legacy.Maliev.Workflows.Tests.csproj -c Release --no-build --no-restore --disable-build-servers --filter 'FullyQualifiedName~FdmJournalEvidenceTests' --logger 'trx;LogFileName=journal-focused.trx' --results-directory TestResults/journal-focused/raw
      - name: Prepare focused privacy-safe original roster
        if: always()
        shell: bash
        run: python3 -B scripts/retain_fdm_journal_focused.py
      - name: Retain focused complete or explicitly unavailable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflows-journal-focused-${{ env.EXPECTED_SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/journal-focused/retained/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  raw-head-evidence:
    name: privacy-safe actual head validation evidence
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/TestResults/raw-evidence
    steps:
      - name: Check out exact head source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_HEAD }}
          persist-credentials: false
      - name: Verify source custody before validation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain)"
      - name: Check out exact evidence controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_OWNER_HEAD }}
          path: .maliev-evidence-controls
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests/test_fdm_validation_guards.py
      - name: Run unchanged full validation with actual TRX logging
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@ce7a577d9672c44cd445915420e3c552c70317d1
        with:
          solution: Legacy.Maliev.Workflows.slnx
      - name: Prepare privacy-safe actual test evidence
        if: always()
        shell: bash
        run: |
          test "$(git -C .maliev-evidence-controls rev-parse HEAD)" = "$EVIDENCE_OWNER_HEAD"
          test -z "$(git -C .maliev-evidence-controls status --porcelain)"
          python3 -B .maliev-evidence-controls/scripts/retain_workflows_test_evidence.py
      - name: Retain complete or explicitly unavailable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflows-head-evidence-${{ env.EXPECTED_SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/workflows-retained/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  raw-baseline-evidence:
    name: privacy-safe actual baseline validation evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 341
    needs: [raw-head-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_HEAD: a08d488e64071cc97bd5a4b270808b5ff28f10a3
      EVIDENCE_OWNER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/TestResults/raw-evidence
    steps:
      - name: Check out exact baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_HEAD }}
          persist-credentials: false
      - name: Verify source custody before validation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain)"
      - name: Check out exact evidence controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_OWNER_HEAD }}
          path: .maliev-evidence-controls
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests/test_fdm_validation_guards.py
      - name: Run unchanged full validation with actual TRX logging
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@ce7a577d9672c44cd445915420e3c552c70317d1
        with:
          solution: Legacy.Maliev.Workflows.slnx
      - name: Prepare privacy-safe actual test evidence
        if: always()
        shell: bash
        run: |
          test "$(git -C .maliev-evidence-controls rev-parse HEAD)" = "$EVIDENCE_OWNER_HEAD"
          test -z "$(git -C .maliev-evidence-controls status --porcelain)"
          python3 -B .maliev-evidence-controls/scripts/retain_workflows_test_evidence.py
      - name: Retain complete or explicitly unavailable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflows-baseline-evidence-${{ env.EXPECTED_SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/workflows-retained/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
